<!DOCTYPE html>
<html lang="en">

<title>Wallet - NOXAS</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>My Wallet</h1>
</header>

<main style="padding:20px; max-width:700px; margin:auto;">
