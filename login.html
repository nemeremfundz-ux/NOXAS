<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NOXAS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Welcome Back to NOXAS</h1>
</header>

<main style="padding:20px; max-width:400px; margin:auto;">
    <h2>Login</h2>

    <form>
        <label>Email</label><br>
        <input type="email" placeholder="Enter your email" required><br><br>

        <label>Password</label><br>
        <input type="password" placeholder="Enter your password" required><br><br>

        <button type="submit" class="btn">Login</button>
    </form>

    <br>

    <p>Don't have an account?
        <a href="register.html">Register here</a>
    </p>

    <p>
        <a href="index.html">← Back to Home</a>
    </p>

</main>

</body>
</html>
